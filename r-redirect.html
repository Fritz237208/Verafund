<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirecting…</title>
</head>
<body>
  <script>
    const match = window.location.pathname.match(/^\/r\/([^/]+)/);
    if (match) {
      const code = match[1];
      window.location.replace('/?ref=' + encodeURIComponent(code));
    } else {
      window.location.replace('/');
    }
  </script>
</body>
</html>
