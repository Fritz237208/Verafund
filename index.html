<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeraFund — Log in or create an account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1120;
    --ink-soft:#5A6479;
    --blue:#155EEF;
    --blue-dark:#0E46B8;
    --navy:#0A2472;
    --green:#16A34A;
    --bg:#EAF2FF;
    --field-bg:#F2F5FA;
    --border:#E5E9F2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,.display{font-family:'Sora',sans-serif; letter-spacing:-0.02em; margin:0;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  :focus-visible{outline:2px solid var(--blue); outline-offset:3px;}

  main{
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px;
  }

  .auth-shell{
    width:100%; max-width:440px;
    border-radius:28px;
    overflow:hidden;
    background:white;
    box-shadow:0 30px 70px -30px rgba(10,36,114,0.28);
    border:1px solid var(--border);
  }

  /* ---------- Hero banner ---------- */
  .hero-banner{
    position:relative; overflow:hidden;
    background:linear-gradient(180deg, #CFE3FF 0%, #EAF2FF 55%, #FFFFFF 100%);
    padding:44px 20px 76px;
    text-align:center;
  }
  .banner-blob{position:absolute; border-radius:50%; filter:blur(2px); opacity:0.55;}
  .blob-1{width:120px; height:120px; background:#FFFFFF; top:-30px; left:-30px; opacity:0.7;}
  .blob-2{width:70px; height:70px; background:#FFFFFF; bottom:10px; right:-10px; opacity:0.8;}
  .blob-3{width:14px; height:14px; background:#FFFFFF; top:60px; right:50px; opacity:0.9;}
  .blob-4{width:10px; height:10px; background:#FFFFFF; top:110px; left:36px; opacity:0.9;}

  .back-link{
    position:absolute; top:20px; left:20px; z-index:2;
    font-size:13.5px; font-weight:600; color:var(--blue-dark);
    display:flex; align-items:center; gap:5px;
  }
  .back-link:hover{text-decoration:underline;}

  .lang-dropdown{position:absolute; top:20px; right:20px; z-index:2;}
  .lang-current{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.7); border:1px solid rgba(255,255,255,0.9); border-radius:999px;
    padding:7px 12px; font-size:12px; font-weight:700; color:var(--blue-dark);
    backdrop-filter:blur(6px);
  }
  .lang-current:hover{background:rgba(255,255,255,0.9);}
  .lang-current svg{width:13px; height:13px;}
  .lang-current .chevron{transition:transform .15s ease;}
  .lang-dropdown.open .lang-current .chevron{transform:rotate(180deg);}
  .lang-menu{
    position:absolute; top:calc(100% + 8px); right:0; z-index:60;
    background:white; border:1px solid var(--border); border-radius:12px;
    box-shadow:0 12px 32px -12px rgba(10,20,50,0.25);
    padding:6px; min-width:150px;
    opacity:0; visibility:hidden; transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s ease;
  }
  .lang-dropdown.open .lang-menu{opacity:1; visibility:visible; transform:translateY(0);}
  .lang-option{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding:9px 11px; border-radius:8px; border:none; background:none;
    font-size:14px; font-weight:500; color:var(--ink); text-align:left;
  }
  .lang-option:hover{background:var(--field-bg);}
  .lang-option.selected{font-weight:700; color:var(--blue);}
  .lang-option .check{width:14px; height:14px; opacity:0;}
  .lang-option.selected .check{opacity:1;}

  .hero-logo{
    position:relative; z-index:1;
    font-family:'Sora',sans-serif; font-weight:800; font-size:52px;
    letter-spacing:-0.02em;
    background:linear-gradient(180deg, #E8F1FF 0%, #6FA4FF 45%, #155EEF 80%, #0A2472 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 8px 16px rgba(21,94,239,0.28));
    padding-top:6px;
  }

  /* ---------- Card ---------- */
  .auth-card{
    position:relative; z-index:2;
    background:white;
    border-radius:28px 28px 0 0;
    margin-top:-32px;
    padding:32px 26px 30px;
  }
  .auth-card h1{font-size:23px; font-weight:700; text-align:center;}
  .auth-card .subtitle{
    margin-top:8px; font-size:14px; color:var(--ink-soft); text-align:center;
  }

  form{display:flex; flex-direction:column; gap:16px; margin-top:26px;}
  .field label{
    display:block; font-size:13.5px; font-weight:600; color:#3A4258;
    margin-bottom:7px;
  }
  .field-row{display:flex; align-items:center; justify-content:space-between;}
  .field-row .forgot{font-size:13px; font-weight:700; color:var(--ink);}
  .field-row .forgot:hover{color:var(--blue);}

  .input-wrap{position:relative;}
  .field input{
    width:100%; padding:13px 15px; font-size:15px; font-family:inherit;
    border:1px solid var(--border); border-radius:12px; background:var(--field-bg);
    color:var(--ink); transition:border-color .15s ease, background .15s ease;
  }
  .field input::placeholder{color:#9AA3B5;}
  .field input:focus{border-color:var(--blue); background:white; outline:none;}
  .input-wrap input{padding-right:44px;}
  .eye-toggle{
    position:absolute; right:13px; top:50%; transform:translateY(-50%);
    background:none; border:none; padding:4px; color:#8B93A7;
    display:flex; align-items:center; justify-content:center;
  }
  .eye-toggle:hover{color:var(--ink-soft);}
  .eye-toggle svg{width:19px; height:19px; display:block;}

  .helper-text{font-size:12.5px; color:var(--ink-soft); margin-top:7px; line-height:1.5;}

  .phone-row{display:flex; gap:10px;}
  .phone-prefix{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    padding:13px 14px; font-size:14.5px; font-weight:600; font-family:inherit;
    border:1px solid var(--border); border-radius:12px; background:var(--field-bg); color:var(--ink);
    white-space:nowrap;
  }
  .phone-row input{flex:1;}

  .checkbox-row{display:flex; align-items:flex-start; gap:10px;}
  .checkbox-row input{margin-top:3px; width:16px; height:16px; accent-color:var(--blue); flex-shrink:0;}
  .terms-content{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex:1;}
  .terms-plain{font-size:13.5px; color:var(--ink-soft); line-height:1.5; flex:1;}
  .terms-links{display:flex; flex-direction:column; gap:2px; flex-shrink:0; text-align:right;}
  .terms-links a{font-size:13.5px; font-weight:700; color:var(--ink); text-decoration:underline; white-space:nowrap;}

  .btn-primary{
    width:100%; padding:16px 24px; border-radius:999px; border:none;
    font-weight:700; font-size:15.5px; color:white;
    background:#155EEF;
    box-shadow:0 10px 24px -10px rgba(21,94,239,0.55);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary:hover{background:var(--blue-dark); transform:translateY(-1px); box-shadow:0 14px 28px -10px rgba(21,94,239,0.6);}
  .btn-primary:disabled{opacity:0.65; cursor:not-allowed; transform:none;}

  .status-msg{
    display:none; margin-top:20px; padding:11px 14px; border-radius:12px;
    font-size:13.5px; font-weight:600; line-height:1.4;
  }
  .status-msg.show{display:block;}
  .status-msg.error{background:#FEF2F2; color:#B91C1C; border:1px solid #FCA5A5;}
  .status-msg.success{background:#F0FDF4; color:#15803D; border:1px solid #86EFAC;}

  .switch-line{text-align:center; font-size:14px; color:var(--ink-soft); margin-top:22px;}
  .switch-link{color:var(--ink); font-weight:700; text-decoration:underline;}

  .mode-block{display:none; flex-direction:column; gap:16px;}
  .mode-block.show{display:flex;}

  @media (max-width:480px){
    main{padding:0;}
    .auth-shell{border-radius:0; border:none; box-shadow:none; min-height:100vh;}
    .hero-logo{font-size:46px;}
  }
</style>
</head>
<body>

<main>
  <div class="auth-shell">

    <div class="hero-banner">
      <a href="#" class="back-link" data-i18n="back_link">← Back</a>
      <div class="lang-dropdown" id="langDropdown">
        <button class="lang-current" onclick="toggleLangMenu(event)" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="langCurrentLabel">EN</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang-menu">
          <button class="lang-option selected" id="langOptEn" onclick="setLang('en')">English <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          <button class="lang-option" id="langOptFr" onclick="setLang('fr')">Français <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
        </div>
      </div>
      <span class="banner-blob blob-1"></span>
      <span class="banner-blob blob-2"></span>
      <span class="banner-blob blob-3"></span>
      <span class="banner-blob blob-4"></span>
      <div class="hero-logo">VeraFund</div>
    </div>

    <div class="auth-card">
      <h1 id="authTitle">Welcome back</h1>
      <p class="subtitle" id="authSubtitle">Log in to continue to VeraFund.</p>

      <div class="status-msg" id="statusMsg"></div>

      <form id="authForm" onsubmit="return false;">

        <!-- LOGIN -->
        <div class="mode-block show" id="loginBlock">
          <div class="field">
            <label for="loginPhone" data-i18n="label_phone">Phone number</label>
            <div class="phone-row">
              <span class="phone-prefix">🇨🇲 +237</span>
              <input type="tel" id="loginPhone" data-i18n-placeholder="ph_phone" placeholder="Enter phone number">
            </div>
          </div>
          <div class="field">
            <div class="field-row">
              <label for="loginPassword" style="margin-bottom:0;" data-i18n="label_password">Password</label>
              <a href="#" class="forgot" data-i18n="forgot_link">Forgot password?</a>
            </div>
            <div class="input-wrap" style="margin-top:7px;">
              <input type="password" id="loginPassword" data-i18n-placeholder="ph_password" placeholder="Enter password">
              <button type="button" class="eye-toggle" data-target="loginPassword" onclick="toggleEye(this)"></button>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="loginSubmit" data-i18n="btn_login">Log in</button>
        </div>

        <!-- SIGNUP -->
        <div class="mode-block" id="signupBlock">
          <div class="field">
            <label for="signupPhone" data-i18n="label_phone">Phone number</label>
            <div class="phone-row">
              <span class="phone-prefix">🇨🇲 +237</span>
              <input type="tel" id="signupPhone" data-i18n-placeholder="ph_phone" placeholder="Enter phone number">
            </div>
          </div>
          <div class="field">
            <label for="signupPassword" data-i18n="label_password">Password</label>
            <div class="input-wrap">
              <input type="password" id="signupPassword" data-i18n-placeholder="ph_password" placeholder="Enter password">
              <button type="button" class="eye-toggle" data-target="signupPassword" onclick="toggleEye(this)"></button>
            </div>
            <div class="helper-text" data-i18n="pw_helper">Use 8 or more characters with a mix of letters, numbers & symbols</div>
          </div>
          <div class="field">
            <label for="confirmPassword" data-i18n="label_confirm">Confirm password</label>
            <div class="input-wrap">
              <input type="password" id="confirmPassword" data-i18n-placeholder="ph_password" placeholder="Enter password">
              <button type="button" class="eye-toggle" data-target="confirmPassword" onclick="toggleEye(this)"></button>
            </div>
          </div>
          <div class="field">
            <label for="referral" data-i18n="label_referral">Referral code (optional)</label>
            <input type="text" id="referral" data-i18n-placeholder="ph_referral" placeholder="Enter referral code">
          </div>
          <label class="checkbox-row">
            <input type="checkbox">
            <div class="terms-content">
              <span class="terms-plain" data-i18n="terms_plain">By creating an account, you agree to our</span>
              <span class="terms-links">
                <a href="#" data-i18n="terms_link1">Terms of use</a>
                <a href="#" data-i18n="terms_link2">Privacy Policy</a>
              </span>
            </div>
          </label>
          <button type="submit" class="btn-primary" id="signupSubmit" data-i18n="btn_signup">Create an account</button>
        </div>

        <div id="turnstileWidget" class="cf-turnstile" data-sitekey="0x4AAAAAAEZVQAywxgQzkQj1" data-callback="onTurnstileVerify" data-expired-callback="onTurnstileExpire"></div>

      </form>

      <p class="switch-line" id="switchLine">
        <span data-i18n="switch_prompt">Don't have an account?</span> <a href="#" class="switch-link" onclick="setMode('signup');return false;" data-i18n="switch_signup">Sign up</a>
      </p>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
  // ---------- i18n ----------
  const translations = {
    en: {
      back_link: "← Back",
      label_email: "Email",
      ph_email: "Email address",
      label_password: "Password",
      ph_password: "Enter password",
      forgot_link: "Forgot password?",
      btn_login: "Log in",

      pw_helper: "Utilisez 8 caractères ou plus avec un mélange de lettres, chiffres et symboles",
      terms_plain: "En créant un compte, vous acceptez nos",
      terms_link1: "Conditions d'utilisation",

      btn_signup: "Créer un compte",
      switch_prompt: "Vous n'avez pas de compte ?",
      switch_signup: "S'inscrire",
      switch_prompt_login: "Vous avez déjà un compte ?",
      switch_signin: "Se connecter",
      title_login: "Content de vous revoir",
      subtitle_login: "Connectez-vous pour continuer vers VeraFund.",
      title_signup: "Vous y êtes presque !",
      subtitle_signup: "Entrez vos informations pour créer votre compte.",
      err_phone_required: "Veuillez entrer votre numéro de téléphone.",
      err_phone_invalid: "Entrez un numéro de téléphone camerounais valide.",
      err_password_required: "Veuillez entrer votre mot de passe.",
      err_password_short: "Le mot de passe doit contenir au moins 8 caractères.",
      err_password_mismatch: "Les mots de passe ne correspondent pas.",
      err_terms: "Veuillez accepter les Conditions d'utilisation et la Politique de confidentialité.",
      err_captcha: "Veuillez compléter la vérification.",
      err_generic: "Une erreur s'est produite. Veuillez réessayer.",
      msg_signup_success: "Compte créé ! Redirection…",
      msg_login_success: "Content de vous revoir ! Redirection…"
    }
  };

  let currentLang = 'en';

  function applyLang(lang){
    currentLang = lang;
    const dict = translations[lang] || translations.en;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (dict[key]) el.setAttribute('placeholder', dict[key]);
    });
    document.documentElement.lang = lang;
    document.getElementById('langCurrentLabel').textContent = lang.toUpperCase();
    document.getElementById('langOptEn').classList.toggle('selected', lang === 'en');
    document.getElementById('langOptFr').classList.toggle('selected', lang === 'fr');
    refreshModeText();
  }

  function setLang(lang){
    try{ localStorage.setItem('VeraFund_lang', lang); }catch(e){}
    applyLang(lang);
    document.getElementById('langDropdown').classList.remove('open');
  }

  function toggleLangMenu(e){
    e.stopPropagation();
    document.getElementById('langDropdown').classList.toggle('open');
  }
  document.addEventListener('click', function(e){
    const dd = document.getElementById('langDropdown');
    if (dd && !dd.contains(e.target)) dd.classList.remove('open');
  });

  function refreshModeText(){
    const dict = translations[currentLang] || translations.en;
    const isLogin = document.getElementById('loginBlock').classList.contains('show');
    document.getElementById('authTitle').textContent = isLogin ? dict.title_login : dict.title_signup;
    document.getElementById('authSubtitle').textContent = isLogin ? dict.subtitle_login : dict.subtitle_signup;
    document.getElementById('switchLine').innerHTML = isLogin
      ? `${dict.switch_prompt} <a href="#" class="switch-link" onclick="setMode('signup');return false;">${dict.switch_signup}</a>`
      : `${dict.switch_prompt_login} <a href="#" class="switch-link" onclick="setMode('login');return false;">${dict.switch_signin}</a>`;
  }

  (function initLang(){
    let saved = 'en';
    try{ saved = localStorage.getItem('VeraFund_lang') || 'en'; }catch(e){}
    applyLang(saved);
  })();

  function setMode(mode){
    const isLogin = mode === 'login';
    document.getElementById('loginBlock').classList.toggle('show', isLogin);
    document.getElementById('signupBlock').classList.toggle('show', !isLogin);
    hideStatus();
    refreshModeText();
  }

  var EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.86 21.86 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.86 21.86 0 0 1-3.22 4.47M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

  function toggleEye(btn){
    var input = document.getElementById(btn.dataset.target);
    var willBeVisible = input.type === 'password';
    input.type = willBeVisible ? 'text' : 'password';
    // icon now reflects the CURRENT state: open eye = visible, struck eye = hidden
    btn.innerHTML = willBeVisible ? EYE_OPEN : EYE_OFF;
    btn.setAttribute('aria-label', willBeVisible ? 'Hide password' : 'Show password');
  }

  document.querySelectorAll('.eye-toggle').forEach(function(btn){
    btn.innerHTML = EYE_OFF; // passwords start hidden
    btn.setAttribute('aria-label', 'Show password');
  });

  // ---------- Supabase ----------
  // TODO: replace with your real project values (Project Settings → API)
  const SUPABASE_URL = 'https://afxqjdbqmpqpverpjikj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmeHFqZGJxbXBxcHZlcnBqaWtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0Mjg1OTcsImV4cCI6MjEwMzAwNDU5N30.ynd0Uvem85-DdFKu3-RkNQsWFnPC_8IQxDyBrl6v6vI';

  let supabaseClient = null;
  if (window.supabase && typeof window.supabase.createClient === 'function'){
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } else {
    console.error('Supabase SDK failed to load — check the script tag / network connection.');
  }

  const REDIRECT_URL = 'dashboard.html';
  const CM_PHONE_RE = /^6\d{8}$/; // Cameroon mobile: starts with 6, 9 digits total

  // ---- Turnstile captcha ----
  let turnstileToken = '';
  window.onTurnstileVerify = function(token){ turnstileToken = token; };
  window.onTurnstileExpire = function(){ turnstileToken = ''; };

  function resetTurnstile(){
    turnstileToken = '';
    if (window.turnstile) window.turnstile.reset('#turnstileWidget');
  }

  function t(key){
    const dict = translations[currentLang] || translations.en;
    return dict[key] || key;
  }

  function showStatus(key, type){
    const el = document.getElementById('statusMsg');
    el.textContent = t(key);
    el.className = 'status-msg show ' + type;
  }

  function hideStatus(){
    const el = document.getElementById('statusMsg');
    el.className = 'status-msg';
  }

  function setLoading(btn, loading, idleKey){
    btn.disabled = loading;
    btn.textContent = loading ? '…' : t(idleKey);
  }

  function toE164(rawDigits){
    return '+237' + rawDigits;
  }

  function cleanDigits(value){
    return (value || '').replace(/\D/g, '');
  }

  // ---- Login ----
  document.getElementById('loginSubmit').addEventListener('click', async function(){
    hideStatus();
    if (!supabaseClient) return showStatus('err_generic', 'error');
    const phoneDigits = cleanDigits(document.getElementById('loginPhone').value);
    const password = document.getElementById('loginPassword').value;

    if (!phoneDigits) return showStatus('err_phone_required', 'error');
    if (!CM_PHONE_RE.test(phoneDigits)) return showStatus('err_phone_invalid', 'error');
    if (!password) return showStatus('err_password_required', 'error');
    if (!turnstileToken) return showStatus('err_captcha', 'error');

    const btn = document.getElementById('loginSubmit');
    setLoading(btn, true);

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      phone: toE164(phoneDigits),
      password: password,
      options: { captchaToken: turnstileToken }
    });

    setLoading(btn, false, 'btn_login');
    resetTurnstile();

    if (error){
      showStatus('err_generic', 'error');
      console.error('Login error:', error.message);
      return;
    }

    showStatus('msg_login_success', 'success');
    window.location.href = REDIRECT_URL;
  });

  // ---- Signup ----
  document.getElementById('signupSubmit').addEventListener('click', async function(){
    hideStatus();
    if (!supabaseClient) return showStatus('err_generic', 'error');
    const phoneDigits = cleanDigits(document.getElementById('signupPhone').value);
    const password = document.getElementById('signupPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const referral = document.getElementById('referral').value.trim();
    const agreed = document.querySelector('#signupBlock input[type="checkbox"]').checked;

    if (!phoneDigits) return showStatus('err_phone_required', 'error');
    if (!CM_PHONE_RE.test(phoneDigits)) return showStatus('err_phone_invalid', 'error');
    if (!password) return showStatus('err_password_required', 'error');
    if (password.length < 8) return showStatus('err_password_short', 'error');
    if (password !== confirmPassword) return showStatus('err_password_mismatch', 'error');
    if (!agreed) return showStatus('err_terms', 'error');
    if (!turnstileToken) return showStatus('err_captcha', 'error');

    const btn = document.getElementById('signupSubmit');
    setLoading(btn, true);

    const { data, error } = await supabaseClient.auth.signUp({
      phone: toE164(phoneDigits),
      password: password,
      options: {
        data: referral ? { referral_code_used: referral } : {},
        captchaToken: turnstileToken
      }
    });

    setLoading(btn, false, 'btn_signup');
    resetTurnstile();

    if (error){
      showStatus('err_generic', 'error');
      console.error('Signup error:', error.message);
      return;
    }

    showStatus('msg_signup_success', 'success');
    window.location.href = REDIRECT_URL;
  });
</script>

</body>
</html>
